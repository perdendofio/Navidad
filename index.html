<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d34">
  <meta name="description" content="Esta Navidad, convierte tu foto en un tejido de lana.">
  <title>Tu foto, tejida en lana</title>
  <style>
    :root {
      --pine: #173d34;
      --pine-deep: #102e28;
      --pine-soft: #28584b;
      --cream: #f7f2e8;
      --paper: #fffdf8;
      --berry: #b83d4b;
      --berry-dark: #96313d;
      --gold: #d7b56d;
      --ink: #25342f;
      --muted: #68766f;
      --line: #e8e0d2;
      --shadow: 0 18px 55px rgba(24, 48, 39, .10);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, rgba(215,181,109,.12), transparent 23rem),
        radial-gradient(circle at 95% 34%, rgba(184,61,75,.07), transparent 25rem),
        var(--cream);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, .drop-zone:focus-visible { outline: 3px solid rgba(184,61,75,.4); outline-offset: 3px; }
    .page-shell { width: min(1040px, calc(100% - 36px)); margin: 0 auto; flex: 1; padding-top: 22px; }
    main { padding-bottom:38px; }
    .hero { position:relative; overflow:hidden; padding:34px 25px 35px; border-radius:25px; color:#fffaf0; background:var(--pine); box-shadow:var(--shadow); }
    .hero:before, .hero:after { content:""; position:absolute; border:1px solid rgba(215,181,109,.24); border-radius:50%; pointer-events:none; }
    .hero:before { width:330px; height:330px; right:-100px; top:-210px; }
    .hero:after { width:235px; height:235px; right:75px; bottom:-200px; }
    .hero-inner { position:relative; z-index:1; max-width:700px; margin:0 auto; text-align:center; }

    /* Logo dentro de óvalo claro rodeado de guirnalda navideña sobre el mensaje principal */
    .hero-logo-wreath {
      position: relative;
      display: grid;
      place-items: center;
      width: 248px;
      height: 112px;
      margin: 0 auto 18px;
    }
    .hero-wreath-svg {
      position: absolute;
      inset: -10px -18px;
      width: calc(100% + 36px);
      height: calc(100% + 20px);
      pointer-events: none;
      overflow: visible;
    }
    .hero-logo-oval {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 222px;
      height: 88px;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--paper);
      border: 2px solid rgba(215, 181, 109, 0.85);
      box-shadow:
        0 8px 22px rgba(7, 22, 17, 0.35),
        inset 0 0 0 2px rgba(255, 253, 248, 0.9);
    }
    .hero-logo-oval img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .hero-logo-fallback {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--pine);
      letter-spacing: -0.4px;
    }

    .eyebrow { display:inline-flex; align-items:center; gap:9px; margin-bottom:12px; color:#ecd9a9; text-transform:uppercase; font-size:10px; font-weight:800; letter-spacing:2.2px; }
    .eyebrow:before, .eyebrow:after { content:""; width:22px; height:1px; background:var(--gold); }
    h1 { margin:0; font-family:Georgia, "Times New Roman", serif; font-size:clamp(35px, 5vw, 57px); font-weight:500; line-height:1.06; letter-spacing:-1.3px; }
    h1 em { color:#e6c77f; font-weight:500; }
    .hero-copy { max-width:560px; margin:14px auto 0; color:rgba(255,250,240,.79); font-size:14px; }
    .workspace { width:min(780px,100%); margin:22px auto 0; }
    .screen { padding:clamp(20px,4vw,32px); border:1px solid rgba(224,215,199,.9); border-radius:22px; background:var(--paper); box-shadow:0 9px 30px rgba(24,48,39,.06); }
    .screen[hidden] { display:none !important; }
    .screen-kicker { display:flex; align-items:center; gap:9px; margin:0 0 7px; color:var(--berry); text-transform:uppercase; letter-spacing:1.5px; font-size:10px; font-weight:850; }
    .screen-kicker .number { display:grid; place-items:center; width:23px; height:23px; border-radius:50%; background:#f8e9e8; color:var(--berry); font-size:11px; letter-spacing:0; }
    h2 { margin:0; color:var(--pine); font-family:Georgia, "Times New Roman", serif; font-size:clamp(24px,3vw,29px); font-weight:600; letter-spacing:-.4px; }
    .panel-intro { margin:7px 0 20px; color:var(--muted); font-size:13px; }
    .drop-zone { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:205px; padding:22px 18px; border:1.5px dashed #c8bda9; border-radius:17px; background:linear-gradient(145deg, #fbf8f1, #fffdf8); text-align:center; transition:border-color .2s, background .2s, transform .2s; }
    .drop-zone.dragover { border-color:var(--berry); background:#fff5f2; transform:scale(1.01); }
    .upload-icon { display:grid; place-items:center; width:51px; height:51px; margin-bottom:11px; border-radius:15px; background:#edf2ed; color:var(--pine); }
    .upload-icon svg { width:26px; height:26px; }
    .drop-title { color:var(--pine); font-weight:800; font-size:14px; }
    .drop-copy { margin:5px 0 13px; color:#7a817a; font-size:12px; }
    .file-button, .primary-button, .secondary-button, .social-button {
      display:inline-flex; align-items:center; justify-content:center; gap:9px; border:0; text-decoration:none; font-weight:800; transition:transform .18s, background .18s, box-shadow .18s, border-color .18s;
    }
    .file-button { min-height:43px; padding:0 19px; border-radius:999px; color:white; background:var(--berry); font-size:12px; box-shadow:0 5px 13px rgba(184,61,75,.18); }
    .file-button:hover, .primary-button:hover:not(:disabled) { background:var(--berry-dark); transform:translateY(-1px); }
    .file-button svg, .primary-button svg, .secondary-button svg, .social-button svg { width:16px; height:16px; flex:none; }
    input[type=file] { display:none; }
    .file-meta { min-height:18px; margin:9px 0 0; color:#8a918b; font-size:11px; text-align:center; }
    .preview-wrap { display:none; max-width:330px; margin:15px auto 0; padding:8px; border-radius:14px; background:#f4f0e7; }
    .preview-wrap.visible { display:block; }
    .preview-wrap img { display:block; width:100%; max-height:220px; object-fit:contain; border-radius:8px; }
    .primary-button { width:100%; min-height:49px; margin-top:17px; padding:0 20px; border-radius:13px; color:white; background:var(--berry); box-shadow:0 7px 16px rgba(184,61,75,.18); font-size:13px; }
    .primary-button:disabled, .secondary-button:disabled, .social-button:disabled { cursor:not-allowed; opacity:.43; transform:none; box-shadow:none; }
    .privacy-note { display:flex; align-items:flex-start; justify-content:center; gap:7px; margin:12px 1px 0; color:#828b83; font-size:10px; line-height:1.5; text-align:center; }
    .privacy-note svg { width:14px; height:14px; flex:none; margin-top:1px; color:var(--pine-soft); }
    .result-header { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:17px; }
    .result-header .panel-intro { margin-bottom:0; }
    .change-button { display:inline-flex; align-items:center; justify-content:center; gap:8px; flex:none; min-height:39px; padding:0 13px; border:1px solid #ded5c6; border-radius:10px; color:var(--pine); background:#fffefa; font-size:11px; font-weight:800; }
    .change-button:hover { background:#f5f1e8; }
    .change-button svg { width:15px; height:15px; }
    .canvas-stage { display:grid; place-items:center; min-height:240px; padding:12px; overflow:hidden; border:1px solid #e9e2d6; border-radius:15px; background-color:#f3eee4; background-image:radial-gradient(#d9d0c1 .75px, transparent .75px); background-size:13px 13px; }
    #resultCanvas { display:block; width:auto; max-width:100%; max-height:72vh; height:auto; border-radius:7px; box-shadow:0 8px 25px rgba(20,37,29,.18); }
    .result-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:13px; }
    .secondary-button { min-height:44px; padding:0 12px; border:1px solid #dcd3c3; border-radius:11px; color:var(--pine); background:#fffefa; font-size:11px; }
    .secondary-button:hover:not(:disabled) { background:#f5f1e8; transform:translateY(-1px); }
    .share-title { margin:18px 0 9px; color:#5c695f; font-size:10px; font-weight:850; letter-spacing:1.3px; text-transform:uppercase; }
    .social-grid { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; }
    .social-button { flex-direction:column; min-height:66px; padding:9px 3px 7px; border:1px solid #e7e0d5; border-radius:11px; color:#59645c; background:#fffefa; font-size:10px; }
    .social-button:hover:not(:disabled) { border-color:#c6b798; background:#faf6ed; transform:translateY(-1px); }
    .social-button svg { width:20px; height:20px; }
    .social-button.whatsapp svg { color:#248b5b; }
    .social-button.facebook svg { color:#3567b2; }
    .social-button.instagram svg { color:#b94e70; }
    .social-button.x-social svg { color:#252525; }
    .social-button.telegram svg { color:#2998c7; }
    .share-note { min-height:30px; margin:9px 1px 0; color:#858d84; font-size:10px; line-height:1.45; }
    footer { width:min(1040px, calc(100% - 36px)); margin:0 auto; padding:17px 0 23px; border-top:1px solid rgba(208,197,178,.65); color:#879087; text-align:center; font-size:11px; }
    footer strong { color:var(--pine); font-family:Georgia,serif; font-size:13px; }
    footer a { color:var(--pine); font-weight:800; text-decoration:underline; text-decoration-color:rgba(23,61,52,.35); text-underline-offset:3px; }
    footer a:hover { color:var(--berry); }
    .toast { position:fixed; z-index:20; left:50%; bottom:20px; width:min(440px,calc(100% - 28px)); padding:12px 16px; border-radius:12px; color:#fffaf1; background:#173d34; box-shadow:0 10px 35px rgba(0,0,0,.2); font-size:12px; text-align:center; opacity:0; pointer-events:none; transform:translate(-50%,15px); transition:opacity .2s, transform .2s; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .loading-dot { display:inline-block; width:7px; height:7px; margin-right:7px; border-radius:50%; background:#f1d48d; animation:pulse .8s infinite alternate; }
    @keyframes pulse { to { opacity:.25; transform:scale(.7); } }

    /* Nieve navideña en segundo plano */
    body::before, body::after {
      content: "";
      position: fixed;
      inset: -120% 0 0;
      pointer-events: none;
      z-index: 20;
      opacity: .48;
      background-image:
        radial-gradient(3px 3px at 18px 42px, rgba(255,255,255,.95) 50%, transparent 55%),
        radial-gradient(2px 2px at 92px 118px, rgba(255,255,255,.85) 50%, transparent 55%),
        radial-gradient(4px 4px at 165px 76px, rgba(255,255,255,.9) 50%, transparent 55%),
        radial-gradient(2px 2px at 238px 156px, rgba(255,255,255,.8) 50%, transparent 55%);
      background-size: 280px 220px;
      animation: snowfall 18s linear infinite;
    }
    body::after {
      opacity: .28;
      background-size: 190px 170px;
      animation-duration: 27s;
      animation-delay: -9s;
      transform: translateX(35px);
    }
    @keyframes snowfall {
      from { transform: translate3d(0, -5%, 0); }
      to { transform: translate3d(28px, 95%, 0); }
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(13, 35, 29, .66);
      backdrop-filter: blur(5px);
    }
    .loading-overlay[hidden] { display: none; }
    .loading-card {
      width: min(100%, 310px);
      padding: 27px 22px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 22px;
      background: #fffdf7;
      color: #244b3d;
      text-align: center;
      box-shadow: 0 18px 55px rgba(0,0,0,.25);
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 15px;
      border: 4px solid #dce9df;
      border-top-color: #2e6f58;
      border-right-color: #c99d4b;
      border-radius: 50%;
      animation: loading-spin .8s linear infinite;
    }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
    .loading-message { font-weight: 700; font-size: 15px; line-height: 1.45; }
    .loading-subtitle { margin-top: 7px; color: #6c7e72; font-size: 12px; }

    @media (max-width:620px) {
      .page-shell { width:min(100% - 22px,1040px); padding-top: 14px; }
      .hero { padding:28px 15px 29px; border-radius:19px; }
      .hero-logo-wreath { width: 214px; height: 96px; margin-bottom: 14px; }
      .hero-logo-oval { width: 192px; height: 76px; padding: 6px 14px; }
      .hero-copy { max-width:430px; font-size:12px; }
      .workspace { margin-top:15px; }
      .screen { padding:19px 15px; border-radius:17px; }
      .drop-zone { min-height:185px; padding:18px 12px; }
      .result-header { display:block; }
      .change-button { margin-top:12px; }
      .canvas-stage { min-height:170px; padding:7px; }
      #resultCanvas { max-height:none; }
      .social-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .social-button { min-height:62px; }
      footer { width:calc(100% - 22px); padding-bottom:18px; font-size:10px; }
    }
    @media (max-width:360px) {
      .result-actions { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion: reduce) { *, *:before, *:after { scroll-behavior:auto !important; animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <div id="appLoading" class="loading-overlay" hidden role="status" aria-live="polite" aria-atomic="true">
    <div class="loading-card">
      <div class="loading-spinner" aria-hidden="true"></div>
      <div id="loadingMessage" class="loading-message"></div>
      <div id="loadingSubtitle" class="loading-subtitle"></div>
    </div>
  </div>
  <div class="page-shell">
    <main id="inicio">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-inner">
          <div class="hero-logo-wreath" aria-hidden="true">
            <svg class="hero-wreath-svg" id="heroWreathSvg" viewBox="0 0 284 132" fill="none"></svg>
            <div class="hero-logo-oval">
              <img id="heroBrandLogo" alt="" hidden>
              <span class="hero-logo-fallback" id="heroBrandFallback"></span>
            </div>
          </div>
          <div class="eyebrow" id="heroEyebrow"></div>
          <h1 id="hero-title"></h1>
          <p class="hero-copy" id="heroCopy"></p>
        </div>
      </section>

      <section class="workspace" aria-label="Creador de imágenes tejidas">
        <!-- Pantalla 1: selección. La pantalla de resultado permanece oculta. -->
        <section class="screen" id="uploadScreen" aria-labelledby="uploadTitle">
          <div class="screen-kicker"><span class="number">1</span> <span id="uploadKicker"></span></div>
          <h2 id="uploadTitle"></h2>
          <p class="panel-intro" id="uploadIntro"></p>

          <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="Seleccionar o arrastrar una fotografía">
            <div class="upload-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></div>
            <div class="drop-title" id="dropTitle"></div>
            <div class="drop-copy" id="dropCopy"></div>
            <label class="file-button" for="photoInput"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg> <span id="choosePhotoLabel"></span></label>
            <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp">
          </div>
          <p class="file-meta" id="fileMeta" aria-live="polite"></p>
          <div class="preview-wrap" id="previewWrap"><img id="photoPreview" alt="Vista previa de la fotografía seleccionada"></div>
          <p class="privacy-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3M12 14v3"/></svg> <span id="privacyNote"></span></p>
        </section>

        <!-- Pantalla 2: resultado. Se muestra solo cuando termina el proceso. -->
        <section class="screen" id="resultScreen" aria-labelledby="resultTitle" hidden>
          <div class="result-header">
            <div>
              <div class="screen-kicker"><span class="number">2</span> <span id="resultKicker"></span></div>
              <h2 id="resultTitle"></h2>
              <p class="panel-intro" id="resultIntro"></p>
            </div>
            <button class="change-button" id="changePhotoButton" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"/><path d="M21 3v5h-5M21 12a9 9 0 0 1-15.4 6.4L3 16"/><path d="M3 21v-5h5"/></svg> <span id="changePhotoLabel"></span></button>
          </div>
          <div class="canvas-stage">
            <canvas id="resultCanvas" aria-label="Fotografía convertida en textura de tejido de lana sobre fondo de punto verde y corona navideña"></canvas>
          </div>
          <div class="result-actions">
            <button class="secondary-button" id="downloadButton" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 17v3h14v-3"/></svg> <span id="downloadLabel"></span></button>
            <button class="secondary-button" id="copyButton" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg> <span id="copyLabel"></span></button>
          </div>
          <button class="primary-button" id="shareImageButton" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4M8.7 13.3l6.6 4.4"/></svg>
            <span id="shareImageLabel"></span>
          </button>
          <div class="share-title" id="shareTitle"></div>
          <div class="social-grid" aria-label="Opciones para compartir">
            <button class="social-button whatsapp" data-social="whatsapp" type="button" aria-label="Compartir en WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.5 0 .2 5.3.2 11.8c0 2.1.6 4.1 1.6 5.9L.1 24l6.4-1.7a12 12 0 0 0 5.6 1.4h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.2-6.2-3.5-8.4ZM12.1 21.7c-1.7 0-3.4-.5-4.8-1.3l-.3-.2-3.8 1 1-3.7-.2-.4a9.8 9.8 0 1 1 8.1 4.6Zm5.4-7.3c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.4.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.2-.7-1.6-.9-2.1-.2-.5-.5-.4-.7-.4h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.1 3c.1.2 2 3.1 4.8 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.1-1.4-.1-.2-.3-.2-.6-.4Z"/></svg> WhatsApp</button>

      function renderHeroGarland() {
        if (!heroWreathSvg) return;
        const svgNS = 'http://www.w3.org/2000/svg';
        const createEl = (tag, attrs) => {
          const el = document.createElementNS(svgNS, tag);
          for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
          return el;
        };

        heroWreathSvg.innerHTML = '';
        const cx = 142;
        const cy = 66;
        const rx = 122;
        const ry = 51;

        heroWreathSvg.appendChild(createEl('ellipse', {
          cx, cy, rx, ry,
          stroke: '#275b49',
          'stroke-width': '4.5',
          'stroke-dasharray': '9 4',
          opacity: '0.9'
        }));

        const greens = ['#2e6f58', '#3c856b', '#1e4d3d', '#4d9b7e'];
        const totalLeaves = 44;

        for (let i = 0; i < totalLeaves; i++) {
          const angle = (i / totalLeaves) * Math.PI * 2;
          const lx = cx + Math.cos(angle) * rx;
          const ly = cy + Math.sin(angle) * ry;
          const deg = (angle * 180) / Math.PI + (i % 2 === 0 ? 38 : -38);
          const color = greens[i % greens.length];

          heroWreathSvg.appendChild(createEl('ellipse', {
            cx: lx,
            cy: ly,
            rx: '9.5',
            ry: '3.6',
            fill: color,
            transform: `rotate(${deg.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})`
          }));

          if (i % 5 === 1) {
            for (const [ox, oy] of [[-2.5, -2], [2.5, -1.5], [0, 2.5]]) {
              heroWreathSvg.appendChild(createEl('circle', {
                cx: (lx + ox).toFixed(1),
                cy: (ly + oy).toFixed(1),
                r: '2.7',
                fill: '#d94857'
              }));
            }
          } else if (i % 7 === 3) {
            heroWreathSvg.appendChild(createEl('circle', {
              cx: lx.toFixed(1),
              cy: ly.toFixed(1),
              r: '2.2',
              fill: '#e6c77f'
            }));
          }
        }
      }

        return new Promise(resolve => {

          if (useCors) img.crossOrigin = 'anonymous';
          img.onload = () => resolve({ ok: true, img });
          img.onerror = () => resolve({ ok: false, img: null });
          img.src = src;
        });

          if (!res.ok) {
            res = await tryLoadLogoImage(BRAND.logoFile, false);

            logoImage = res.img;

      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
      function rgbToCss(r, g, b) {
        return `rgb(${Math.round(clamp(r, 0, 255))}, ${Math.round(clamp(g, 0, 255))}, ${Math.round(clamp(b, 0, 255))})`;
      }
      function scaleColor(rgb, factor) { return rgb.map(channel => clamp(channel * factor, 0, 255)); }

      function seededRandom(seed) {
        let state = seed >>> 0;
        return function random() {
          state += 0x6D2B79F5;
          let value = state;
          value = Math.imul(value ^ (value >>> 15), value | 1);
          value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
          return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
        };
      }

      function stitchSeed(column, row) {
        let seed = Math.imul(column + 4099, 374761393) ^ Math.imul(row + 8191, 668265263);
        seed = Math.imul(seed ^ (seed >>> 13), 1274126177);
        return (seed ^ (seed >>> 16)) >>> 0;
      }

      function drawPlushJerseyBackground(ctx, width, height) {
        const random = seededRandom(20261225);

        const baseGrad = ctx.createRadialGradient(
          width * 0.42, height * 0.35, Math.min(width, height) * 0.08,
          width * 0.5, height * 0.5, Math.max(width, height) * 0.88
        );
        baseGrad.addColorStop(0, '#1e4d41');
        baseGrad.addColorStop(0.55, '#173d34');
        baseGrad.addColorStop(1, '#102d26');
        ctx.fillStyle = baseGrad;
        ctx.fillRect(0, 0, width, height);

        const loopW = 10;
        const loopH = 8;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (let row = -1; row * loopH < height + loopH; row++) {
          const y = row * loopH;
          const rowShift = (row % 2) * (loopW * 0.5);
          for (let col = -1; col * loopW < width + loopW; col++) {
            const x = col * loopW + rowShift;
            const shade = (random() - 0.5) * 0.05;

            ctx.fillStyle = `rgba(6, 18, 14, ${0.22 + shade})`;
            ctx.beginPath();
            ctx.ellipse(x + loopW * 0.5, y + loopH * 0.82, loopW * 0.44, loopH * 0.24, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = `rgba(42, 98, 83, ${0.42 + shade})`;
            ctx.lineWidth = 2.1;
            ctx.beginPath();
            ctx.moveTo(x + loopW * 0.18, y + loopH * 0.15);
            ctx.quadraticCurveTo(x + loopW * 0.25, y + loopH * 0.55, x + loopW * 0.48, y + loopH * 0.84);
            ctx.stroke();

            ctx.strokeStyle = `rgba(22, 58, 49, ${0.48 - shade})`;
            ctx.lineWidth = 2.1;
            ctx.beginPath();
            ctx.moveTo(x + loopW * 0.82, y + loopH * 0.15);
            ctx.quadraticCurveTo(x + loopW * 0.75, y + loopH * 0.55, x + loopW * 0.52, y + loopH * 0.84);
            ctx.stroke();

            ctx.strokeStyle = `rgba(176, 212, 195, ${0.09 + Math.max(0, shade)})`;
            ctx.lineWidth = 1.05;
            ctx.beginPath();
            ctx.moveTo(x + loopW * 0.22, y + loopH * 0.2);
            ctx.quadraticCurveTo(x + loopW * 0.3, y + loopH * 0.52, x + loopW * 0.47, y + loopH * 0.76);
            ctx.stroke();
          }
        }

        const area = width * height;
        const fuzzCount = Math.min(42000, Math.round(area * 0.024));
        for (let i = 0; i < fuzzCount; i++) {
          const fx = random() * width;
          const fy = random() * height;
          const angle = random() * Math.PI * 2;
          const len = 2 + random() * 6.5;
          const ex = fx + Math.cos(angle) * len;
          const ey = fy + Math.sin(angle) * len;
          const tone = random();
          ctx.beginPath();
          ctx.moveTo(fx, fy);
          ctx.lineTo(ex, ey);
          if (tone > 0.62) {
            ctx.strokeStyle = `rgba(190, 222, 207, ${0.035 + random() * 0.06})`;
          } else if (tone > 0.25) {
            ctx.strokeStyle = `rgba(48, 104, 88, ${0.07 + random() * 0.07})`;
          } else {
            ctx.strokeStyle = `rgba(7, 21, 17, ${0.08 + random() * 0.08})`;
          }
          ctx.lineWidth = 0.75 + random() * 1.4;
          ctx.stroke();
        }

        const defectCount = Math.max(24, Math.round(area / 32000));
        for (let i = 0; i < defectCount; i++) {
          const dx = random() * width;
          const dy = random() * height;
          const type = random();

          if (type < 0.55) {
            const r = 1.5 + random() * 2.5;
            ctx.beginPath();
            ctx.arc(dx + 1, dy + 1.3, r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(5, 16, 13, 0.38)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(dx, dy, r, 0, Math.PI * 2);
            ctx.fillStyle = random() > 0.4 ? 'rgba(72, 128, 110, 0.45)' : 'rgba(165, 200, 184, 0.26)';
            ctx.fill();
          } else {
            const pullLen = 14 + random() * 32;
            const pullAngle = (random() - 0.5) * 0.75;
            ctx.beginPath();
            ctx.moveTo(dx, dy);
            ctx.quadraticCurveTo(
              dx + pullLen * 0.5,
              dy + Math.sin(pullAngle) * 7 + (random() - 0.5) * 5,
              dx + pullLen,
              dy + Math.sin(pullAngle) * 12
            );
            ctx.strokeStyle = 'rgba(6, 19, 15, 0.36)';
            ctx.lineWidth = 1.6;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(dx, dy - 1.2);
            ctx.quadraticCurveTo(
              dx + pullLen * 0.5,
              dy + Math.sin(pullAngle) * 7 - 1.2,
              dx + pullLen,
              dy + Math.sin(pullAngle) * 12 - 1.2
            );
            ctx.strokeStyle = 'rgba(182, 216, 200, 0.18)';
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }

        const looseThreads = Math.max(32, Math.round(area / 22000));
        for (let i = 0; i < looseThreads; i++) {
          const sx = random() * width;
          const sy = random() * height;
          const len = 16 + random() * 44;
          const a1 = random() * Math.PI * 2;
          const a2 = a1 + (random() - 0.5) * 2.2;
          const mx = sx + Math.cos(a1) * (len * 0.55);
          const my = sy + Math.sin(a1) * (len * 0.55);
          const ex = mx + Math.cos(a2) * (len * 0.55);
          const ey = my + Math.sin(a2) * (len * 0.55);

          ctx.beginPath();
          ctx.moveTo(sx + 1.2, sy + 1.6);
          ctx.quadraticCurveTo(mx + 1.2, my + 1.6, ex + 1.2, ey + 1.6);
          ctx.strokeStyle = 'rgba(4, 15, 11, 0.38)';
          ctx.lineWidth = 1.25 + random() * 1;
          ctx.stroke();

          ctx.beginPath();

      function buildAlphaMask(pixels, width, height, tolerance) {
        const total = width * height;
        const mask = new Float32Array(total);
        mask.fill(1);

        let hasExistingAlpha = false;
        for (let i = 3; i < pixels.length; i += 4) {
          if (pixels[i] < 250) {
            hasExistingAlpha = true;
            break;
          }
        }
        if (hasExistingAlpha) {
          for (let p = 0, i = 3; p < total; p++, i += 4) {
            mask[p] = pixels[i] / 255;
          }
          return mask;
        }

        const visited = new Uint8Array(total);
        const queue = new Int32Array(total);
        let head = 0;
        let tail = 0;

        let br = 0, bg = 0, bb = 0, bCount = 0;
        const addBorderSeed = (x, y) => {
          const idx = y * width + x;
          if (!visited[idx]) {
            visited[idx] = 1;
            queue[tail++] = idx;
            const p = idx * 4;
            br += pixels[p];
            bg += pixels[p + 1];
            bb += pixels[p + 2];
            bCount++;
          }
        };

        for (let x = 0; x < width; x++) {
          addBorderSeed(x, 0);
          addBorderSeed(x, height - 1);
        }
        for (let y = 1; y < height - 1; y++) {
          addBorderSeed(0, y);
          addBorderSeed(width - 1, y);
        }

        br /= Math.max(1, bCount);
        bg /= Math.max(1, bCount);
        bb /= Math.max(1, bCount);

        const colorDist = idx => {
          const p = idx * 4;
          const dr = pixels[p] - br;
          const dg = pixels[p + 1] - bg;
          const db = pixels[p + 2] - bb;
          return Math.sqrt(dr * dr + dg * dg + db * db);
        };

        while (head < tail) {
          const curr = queue[head++];
          if (colorDist(curr) > tolerance) continue;

          mask[curr] = 0;
          const cx = curr % width;
          const cy = (curr - cx) / width;

          if (cx > 0) {
            const n = curr - 1;
            if (!visited[n]) { visited[n] = 1; queue[tail++] = n; }
          }
          if (cx < width - 1) {
            const n = curr + 1;
            if (!visited[n]) { visited[n] = 1; queue[tail++] = n; }
          }
          if (cy > 0) {
            const n = curr - width;
            if (!visited[n]) { visited[n] = 1; queue[tail++] = n; }
          }
          if (cy < height - 1) {
            const n = curr + width;
            if (!visited[n]) { visited[n] = 1; queue[tail++] = n; }
          }
        }

        const smooth = new Float32Array(total);
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            let sum = 0, count = 0;
            for (let dy = -1; dy <= 1; dy++) {
              const ny = y + dy;
              if (ny < 0 || ny >= height) continue;
              for (let dx = -1; dx <= 1; dx++) {
                const nx = x + dx;
                if (nx < 0 || nx >= width) continue;
                sum += mask[ny * width + nx];
                count++;
              }
            }
            smooth[y * width + x] = sum / count;
          }
        }
        return smooth;
      }

      function averageAlpha(mask, width, height, x0, y0, x1, y1) {
        const left = clamp(Math.floor(x0), 0, width - 1);
        const top = clamp(Math.floor(y0), 0, height - 1);
        const right = clamp(Math.ceil(x1), left + 1, width);
        const bottom = clamp(Math.ceil(y1), top + 1, height);
        let sum = 0, count = 0;
        for (let y = top; y < bottom; y++) {
          const rowOffset = y * width;
          for (let x = left; x < right; x++) {
            sum += mask[rowOffset + x];
            count++;
          }
        }
        return count ? sum / count : 1;
      }

      function averageColor(data, mask, width, height, x0, y0, x1, y1) {
        const left = clamp(Math.floor(x0), 0, width - 1);
        const top = clamp(Math.floor(y0), 0, height - 1);
        const right = clamp(Math.ceil(x1), left + 1, width);
        const bottom = clamp(Math.ceil(y1), top + 1, height);
        let r = 0, g = 0, b = 0, weightSum = 0;
        let fr = 0, fg = 0, fb = 0, fallbackCount = 0;
        for (let y = top; y < bottom; y++) {
          const rowOffset = y * width;
          for (let x = left; x < right; x++) {
            const pIdx = rowOffset + x;
            const index = pIdx * 4;
            const pr = data[index];
            const pg = data[index + 1];
            const pb = data[index + 2];
            fr += pr; fg += pg; fb += pb; fallbackCount++;
            const w = mask ? mask[pIdx] : 1;
            if (w > 0.05) {
              r += pr * w;
              g += pg * w;
              b += pb * w;
              weightSum += w;
            }
          }
        }
        if (weightSum > 0) return [r / weightSum, g / weightSum, b / weightSum];
        return fallbackCount ? [fr / fallbackCount, fg / fallbackCount, fb / fallbackCount] : [120, 120, 120];
      }

      function drawChristmasWreathFrame(ctx, w, h, frameSize) {
        const random = seededRandom(12252026);
        const half = frameSize * 0.52;
        const left = half;
        const top = half;
        const right = w - half;
        const bottom = h - half;
        const innerW = Math.max(10, right - left);
        const innerH = Math.max(10, bottom - top);
        const perimeter = 2 * (innerW + innerH);

        ctx.lineWidth = frameSize * 0.62;

          let d = ((dist % perimeter) + perimeter) % perimeter;
          if (d < innerW) return { x: left + d, y: top, angle: 0 };
          d -= innerW;
          if (d < innerH) return { x: right, y: top + d, angle: Math.PI / 2 };
          d -= innerH;
          if (d < innerW) return { x: right - d, y: bottom, angle: Math.PI };
          d -= innerW;
          return { x: left, y: bottom - d, angle: -Math.PI / 2 };
        }

        const pineGreens = ['#113326', '#1a4936', '#235e45', '#2d7052', '#174231'];
        const step = Math.max(9, frameSize * 0.22);

        for (let layer = 0; layer < 3; layer++) {
          for (let d = layer * (step * 0.35); d < perimeter; d += step) {
            const pt = pointOnBorder(d);
            const sideSign = ((Math.round(d / step) + layer) % 2 === 0) ? 1 : -1;
            const branchAngle = pt.angle + sideSign * (0.42 + random() * 0.45);
            const branchLen = frameSize * (0.42 + random() * 0.26);

            const bx = pt.x + (random() - 0.5) * (frameSize * 0.22);
            const by = pt.y + (random() - 0.5) * (frameSize * 0.22);
            const ex = bx + Math.cos(branchAngle) * branchLen;
            const ey = by + Math.sin(branchAngle) * branchLen;

            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(ex, ey);
            ctx.strokeStyle = pineGreens[Math.floor(random() * pineGreens.length)];
            ctx.lineWidth = 2.6 + random() * 1.6;
            ctx.stroke();

            const needles = 6;
            for (let n = 1; n <= needles; n++) {
              const t = n / (needles + 1);

              const ny = by + (ey - by) * t;
              const needleLen = frameSize * (0.16 + (1 - t) * 0.14);
              for (const dir of [-1, 1]) {

                ctx.beginPath();
                ctx.moveTo(nx, ny);
                ctx.lineTo(nx + Math.cos(na) * needleLen, ny + Math.sin(na) * needleLen);
                ctx.strokeStyle = pineGreens[(layer + n + (dir > 0 ? 1 : 0)) % pineGreens.length];

          const pt = pointOnBorder(d + (random() - 0.5) * 18);
          const cx = pt.x + (random() - 0.5) * (frameSize * 0.25);
          const cy = pt.y + (random() - 0.5) * (frameSize * 0.25);

          const offsets = [
            [-3.2, -2.4],
            [3.4, -1.6],

          ctx.arc(gx, gy, Math.max(2, frameSize * 0.055), 0, Math.PI * 2);
          ctx.fillStyle = '#e7c675';
          ctx.fill();
        }

        const corners = [
          { x: left, y: top, rot: -Math.PI / 4 },
          { x: right, y: top, rot: Math.PI / 4 },
          { x: right, y: bottom, rot: (3 * Math.PI) / 4 },

          ctx.fillStyle = '#d64554';

          ctx.stroke();
          ctx.restore();

        ctx.restore();

      function getExperienceUrl() {
        if (BRAND.experienceUrl) {

        }
        if (location.protocol === 'http:' || location.protocol === 'https:') {

          url.hash = '';

        if (BRAND.website) {

        }
        return '';

      function drawRoundRectPath(ctx, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + w - radius, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
        ctx.lineTo(x + w, y + h - radius);
        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        ctx.lineTo(x + radius, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }

      /* Dibuja un parche de tela realista con ligera inclinación, textura textil y algún hilo suelto */
      function drawFabricPatchWithLogo(ctx, centerX, centerY, patchW, patchH, tiltRad = -0.072) {

        const x = -patchW / 2;

          ctx.lineTo(x + offset - patchH * 0.42, y + patchH);
          ctx.strokeStyle = 'rgba(130, 110, 78, 0.12)';

          ctx.beginPath();
          ctx.moveTo(x + offset + weaveStep * 0.5, y);
          ctx.lineTo(x + offset + weaveStep * 0.5 - patchH * 0.42, y + patchH);
          ctx.strokeStyle = 'rgba(255, 253, 248, 0.44)';

          ctx.beginPath();
          ctx.moveTo(x + offset, y);
          ctx.lineTo(x + offset + patchH * 0.28, y + patchH);
          ctx.strokeStyle = 'rgba(145, 124, 90, 0.055)';
          ctx.stroke();

          const fy = y + random() * patchH;

          const len = 1.6 + random() * 5.2;

          ctx.lineTo(fx + Math.cos(angle) * len, fy + Math.sin(angle) * len);

          ctx.lineWidth = 0.55 + random() * 0.72;
          ctx.stroke();
        }

        // Ligero abombado central y sombreado perimetral interior de tela
        const innerInset = Math.max(3.5, Math.min(patchW, patchH) * 0.075);
        drawRoundRectPath(
          ctx,
          x + innerInset,
          y + innerInset,
          patchW - innerInset * 2,
          patchH - innerInset * 2,
          Math.max(2, cornerR - innerInset * 0.6)
        );
        ctx.strokeStyle = 'rgba(118, 98, 66, 0.22)';
        ctx.lineWidth = Math.max(1.1, patchH * 0.028);

        ctx.lineWidth = Math.max(1.5, patchH * 0.044);

        const stitchInset = Math.max(3.8, Math.min(patchW, patchH) * 0.085);

        const sy = y + stitchInset;

        const stitchLen = Math.max(3.5, Math.min(sw, sh) * 0.09);

            const cx = sx + sw - sr;
            const cy = sy + sr;
            return { x: cx + Math.cos(a) * sr, y: cy + Math.sin(a) * sr, tx: -Math.sin(a), ty: Math.cos(a), nx: -Math.cos(a), ny: -Math.sin(a) };
          }
          d -= arcLen;

          if (d < straightH) {
            return { x: sx + sw, y: sy + sr + d, tx: 0, ty: 1, nx: -1, ny: 0 };
          }
          d -= straightH;

          if (d < arcLen) {
            const a = d / sr;
            const cx = sx + sw - sr;
            const cy = sy + sh - sr;
            return { x: cx + Math.cos(a) * sr, y: cy + Math.sin(a) * sr, tx: -Math.sin(a), ty: Math.cos(a), nx: -Math.cos(a), ny: -Math.sin(a) };
          }
          d -= arcLen;

          if (d < straightW) {
            return { x: sx + sw - sr - d, y: sy + sh, tx: -1, ty: 0, nx: 0, ny: -1 };
          }
          d -= straightW;

          if (d < arcLen) {
            const a = Math.PI / 2 + d / sr;
            const cx = sx + sr;
            const cy = sy + sh - sr;
            return { x: cx + Math.cos(a) * sr, y: cy + Math.sin(a) * sr, tx: -Math.sin(a), ty: Math.cos(a), nx: -Math.cos(a), ny: -Math.sin(a) };
          }
          d -= arcLen;

          if (d < straightH) {
            return { x: sx, y: sy + sh - sr - d, tx: 0, ty: -1, nx: 1, ny: 0 };
          }
          d -= straightH;

          const a = Math.PI + d / sr;
          const cx = sx + sr;
          const cy = sy + sr;
          return { x: cx + Math.cos(a) * sr, y: cy + Math.sin(a) * sr, tx: -Math.sin(a), ty: Math.cos(a), nx: -Math.cos(a), ny: -Math.sin(a) };
        }

        ctx.lineCap = 'round';
        const threadWidth = Math.max(1.15, patchH * 0.033);
        for (let dist = 0; dist < totalPerimeter; dist += period) {
          const p0 = pointOnPatchStitch(dist);
          const p1 = pointOnPatchStitch(dist + Math.min(stitchLen, totalPerimeter - dist));

          ctx.beginPath();
          ctx.moveTo(p0.x + p0.nx * 0.75, p0.y + p0.ny * 0.75 + 0.65);
          ctx.lineTo(p1.x + p1.nx * 0.75, p1.y + p1.ny * 0.75 + 0.65);
          ctx.strokeStyle = 'rgba(88, 70, 40, 0.36)';
          ctx.lineWidth = threadWidth;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.strokeStyle = '#9a752e';
          ctx.lineWidth = threadWidth;
          ctx.stroke();
        }

        // Hilos sueltos orgánicos alrededor del parche (hilo de costura y pelusas textiles)
        const looseSpecs = [
          { dist: totalPerimeter * 0.14, len: patchW * 0.14, curl: 0.24, color: '#a67f36', width: 1.05 },
          { dist: totalPerimeter * 0.37, len: patchW * 0.17, curl: -0.28, color: '#efe4ca', width: 0.95 },
          { dist: totalPerimeter * 0.63, len: patchW * 0.13, curl: 0.22, color: '#9a752e', width: 1.0 },
          { dist: totalPerimeter * 0.86, len: patchW * 0.19, curl: -0.25, color: '#f7eed9', width: 0.9 }
        ];

        looseSpecs.forEach(spec => {
          const anchor = pointOnPatchStitch(spec.dist);
          const outX = -anchor.nx;
          const outY = -anchor.ny;
          const baseAngle = Math.atan2(outY, outX) + (random() - 0.5) * 0.65;
          const cAngle = baseAngle + spec.curl * 2.2;

          const startX = anchor.x + outX * (stitchInset * 0.45);
          const startY = anchor.y + outY * (stitchInset * 0.45);
          const midX = startX + Math.cos(baseAngle) * (spec.len * 0.55);
          const midY = startY + Math.sin(baseAngle) * (spec.len * 0.55);
          const endX = midX + Math.cos(cAngle) * (spec.len * 0.58);
          const endY = midY + Math.sin(cAngle) * (spec.len * 0.58);

          // Sombra tenue del hilo suelto sobre el punto
          ctx.beginPath();
          ctx.moveTo(startX + 0.9, startY + 1.2);
          ctx.quadraticCurveTo(midX + 0.9, midY + 1.2, endX + 0.9, endY + 1.2);
          ctx.strokeStyle = 'rgba(4, 15, 11, 0.42)';
          ctx.lineWidth = Math.max(0.8, spec.width * 1.1);
          ctx.stroke();

          // Hebra suelta
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.quadraticCurveTo(midX, midY, endX, endY);
          ctx.strokeStyle = spec.color;
          ctx.lineWidth = Math.max(0.75, spec.width);
          ctx.stroke();
        });

        // Logo (o nombre de marca) centrado en el parche
        const contentW = sw - stitchInset * 1.45;
        const contentH = sh - stitchInset * 1.45;

        if (logoReady && logoImage && logoImage.naturalWidth > 0 && logoImage.naturalHeight > 0) {
          const ratio = Math.min(contentW / logoImage.naturalWidth, contentH / logoImage.naturalHeight);
          const drawW = logoImage.naturalWidth * ratio;
          const drawH = logoImage.naturalHeight * ratio;
          ctx.drawImage(
            logoImage,
            -drawW / 2,
            -drawH / 2,
            drawW,
            drawH
          );
        } else {
          const fallbackSize = Math.max(8, contentH * 0.36);
          ctx.fillStyle = '#173d34';
          ctx.font = `700 ${fallbackSize}px Georgia, "Times New Roman", serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(BRAND.name, 0, 0);
        }

        ctx.restore();
      }

      /* Dibuja el parche de tela con el logo en la esquina inferior derecha evitando solaparse con el marco */
      function drawBottomRightBrandBadge(ctx, width, height, frameSize = SETTINGS.wreathFrameSize) {
        const patchW = Math.max(106, Math.min(width * 0.195, height * 0.195));
        const patchH = patchW * 0.56;
        const inset = Math.max(frameSize + 20, Math.min(width, height) * 0.05);
        const centerX = width - inset - patchW / 2;
        const centerY = height - inset - patchH / 2;
        drawFabricPatchWithLogo(ctx, centerX, centerY, patchW, patchH, -0.072);
      }

      async function createWovenImage() {
        if (!sourceImage) return;
        setBusy(true);
        await logoLoadPromise;
        await new Promise(resolve => requestAnimationFrame(resolve));
        try {
          const factor = Math.min(1, SETTINGS.maxOutputDimension / Math.max(sourceImage.naturalWidth, sourceImage.naturalHeight));
          const width = Math.max(1, Math.round(sourceImage.naturalWidth * factor));
          const imageHeight = Math.max(1, Math.round(sourceImage.naturalHeight * factor));

          const sampleCanvas = document.createElement('canvas');
          sampleCanvas.width = width;
          sampleCanvas.height = imageHeight;
          const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
          sampleCtx.clearRect(0, 0, width, imageHeight);
          sampleCtx.imageSmoothingEnabled = true;
          sampleCtx.imageSmoothingQuality = 'high';
          sampleCtx.drawImage(sourceImage, 0, 0, width, imageHeight);
          const pixels = sampleCtx.getImageData(0, 0, width, imageHeight).data;

          const alphaMask = SETTINGS.removeBackground
            ? buildAlphaMask(pixels, width, imageHeight, SETTINGS.bgTolerance)
            : null;

          const frame = SETTINGS.wreathFrameSize;
          const framedWidth = width + frame * 2;
          const framedHeight = imageHeight + frame * 2;

          resultCanvas.width = framedWidth;
          resultCanvas.height = framedHeight;

          const ctx = resultCanvas.getContext('2d');
          ctx.fillStyle = SETTINGS.knitBaseColor;
          ctx.fillRect(0, 0, resultCanvas.width, resultCanvas.height);

          const knit = document.createElement('canvas');
          knit.width = width;
          knit.height = imageHeight;
          const kctx = knit.getContext('2d');
          drawPlushJerseyBackground(kctx, width, imageHeight);

          const pitchX = SETTINGS.pitchX;
          const pitchY = SETTINGS.pitchY;

          let row = 0;
          for (let y = -Math.round(pitchY * 0.35); y < imageHeight; y += pitchY, row++) {
            const offsetX = row % 2 === 0 ? -pitchX * 0.5 : 0;
            let column = 0;
            for (let x = offsetX; x < width; x += pitchX, column++) {
              if (alphaMask) {
                const cellAlpha = averageAlpha(alphaMask, width, imageHeight, x, y, x + pitchX, y + pitchY);
                if (cellAlpha < SETTINGS.transparentThreshold) continue;
              }
              const color = averageColor(pixels, alphaMask, width, imageHeight, x, y, x + pitchX, y + pitchY);
              const random = seededRandom(stitchSeed(column, row));
              const jitterX = (random() * 2 - 1) * SETTINGS.stitchJitter;
              const jitterY = (random() * 2 - 1) * SETTINGS.stitchJitter;
              const stitchX = x + (pitchX - SETTINGS.stitchWidth) / 2 + jitterX;
              const stitchY = y + (pitchY - SETTINGS.stitchHeight) / 2 + jitterY;
              drawKnitStitch(kctx, stitchX, stitchY, color, random);
            }
          }

          drawPlushJerseyBackground(ctx, framedWidth, framedHeight);
          ctx.drawImage(knit, frame, frame);
          drawChristmasWreathFrame(ctx, framedWidth, framedHeight, frame);
          drawBottomRightBrandBadge(ctx, framedWidth, framedHeight, frame);

          generatedImageFile = null;
          try {
            generatedImageFile = await canvasToFile();
          } catch (exportError) {
            console.warn('No se pudo preparar el archivo para compartir:', exportError);
          }

          showScreen('result');

          let canShareImage = false;
          try {
            canShareImage = !!(
              generatedImageFile &&
              window.isSecureContext &&
              typeof navigator.share === 'function' &&
              typeof navigator.canShare === 'function' &&
              navigator.canShare({ files: [generatedImageFile] })
            );
          } catch (_) {
            canShareImage = false;
          }
          shareImageButton.hidden = !canShareImage;

          shareNote.textContent = canShareImage ? COPY.canShareNote : COPY.cannotShareNote;
          showToast(COPY.readyToast);
        } catch (error) {
          console.error(error);
          showToast(COPY.weaveErrorToast);
        } finally {
          setBusy(false);
        }
      }

      function formatTimestamp(date = new Date()) {
        const pad = n => String(n).padStart(2, '0');
        return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}-${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
      }

      function buildDownloadFileName(baseName = BRAND.downloadFileName, date = new Date()) {
        const clean = String(baseName || 'imagen-tejida.png').trim() || 'imagen-tejida.png';
        const stamp = formatTimestamp(date);
        const dotIdx = clean.lastIndexOf('.');
        if (dotIdx > 0) {
          return `${clean.slice(0, dotIdx)}-${stamp}${clean.slice(dotIdx)}`;
        }
        return `${clean}-${stamp}`;
      }

      async function canvasToBlob() {
        const blob = await new Promise(resolve => {
          try {
            resultCanvas.toBlob(resolve, 'image/png');
          } catch (_) {
            resolve(null);
          }
        });
        if (!blob) throw new Error('No se pudo crear el PNG (canvas bloqueado o no disponible).');
        return blob;
      }

      async function canvasToFile() {
        const blob = await canvasToBlob();
        return new File([blob], buildDownloadFileName(), { type: 'image/png' });
      }

      async function downloadImage() {
        try {
          const blob = await canvasToBlob();
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.download = buildDownloadFileName();
          link.href = url;
          document.body.appendChild(link);
          link.click();
          link.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 1500);
          return true;
        } catch (err) {
          console.error(err);
          showToast(COPY.exportErrorToast);
          return false;
        }
      }

      function shareMessage() {
        return COPY.buildShareMessage(getExperienceUrl());
      }

      function shareImage() {
        const file = generatedImageFile;
        if (!file || typeof navigator.share !== 'function') {
          shareNote.textContent = COPY.shareUnavailableNote;
          return;
        }

        showLoading(COPY.loadingShareImage);
        try {
          const result = navigator.share({
            files: [file],
            title: COPY.shareImageTitle
          });
          Promise.resolve(result).then(() => {
            shareNote.textContent = COPY.shareClosedNote;
          }).catch(error => {
            if (error && error.name === 'AbortError') {
              shareNote.textContent = COPY.shareAbortedNote;
              return;
            }
            console.error('Error compartiendo la imagen:', error);
            shareNote.textContent = COPY.shareFailedNote;
          }).finally(hideLoading);
        } catch (error) {
          hideLoading();
          console.error('No se pudo iniciar el uso compartido:', error);
          shareNote.textContent = COPY.shareOpenFailedNote;
        }
      }

      function shareTextTo(platform) {
        const message = shareMessage();
        const url = getExperienceUrl() || BRAND.website;
        const encodedMessage = encodeURIComponent(message);
        const encodedUrl = encodeURIComponent(url);

        const destinations = {
          whatsapp: `https://wa.me/?text=${encodedMessage}`,
          facebook: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}&quote=${encodedMessage}`,
          x: `https://twitter.com/intent/tweet?text=${encodedMessage}`,
          telegram: `https://t.me/share/url?url=${encodedUrl}&text=${encodedMessage}`
        };

        if (platform === 'instagram') {
          const openInstagram = () => {
            window.open('https://www.instagram.com/', '_blank', 'noopener,noreferrer');
            shareNote.textContent = COPY.instagramCopiedNote;
            showToast(COPY.instagramCopiedToast);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            showLoading(COPY.loadingCopyInstagram);
            navigator.clipboard.writeText(message).then(openInstagram).catch(() => {
              window.open('https://www.instagram.com/', '_blank', 'noopener,noreferrer');
              shareNote.textContent = `${COPY.instagramCopiedNote} ${message}`;
            }).finally(hideLoading);
          } else {
            window.open('https://www.instagram.com/', '_blank', 'noopener,noreferrer');
            shareNote.textContent = `${COPY.instagramCopiedNote} ${message}`;
          }
          return;
        }

        const destination = destinations[platform];
        if (!destination) return;
        window.open(destination, '_blank', 'noopener,noreferrer');
        shareNote.textContent = COPY.socialOpenedNote;
      }

      photoInput.addEventListener('change', event => loadPhoto(event.target.files[0]));
      dropZone.addEventListener('click', event => {
        if (event.target.closest('label')) return;
        photoInput.click();
      });
      dropZone.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); photoInput.click(); }
      });
      ['dragenter', 'dragover'].forEach(type => dropZone.addEventListener(type, event => {
        event.preventDefault();
        event.stopPropagation();
        dropZone.classList.add('dragover');
      }));
      ['dragleave', 'drop'].forEach(type => dropZone.addEventListener(type, event => {
        event.preventDefault();
        event.stopPropagation();
        dropZone.classList.remove('dragover');
      }));
      dropZone.addEventListener('drop', event => loadPhoto(event.dataTransfer.files[0]));

      changePhotoButton.addEventListener('click', clearSelectedPhoto);

      downloadButton.addEventListener('click', async () => {
        const ok = await downloadImage();
        if (ok) showToast(COPY.downloadedToast);
      });

      copyButton.addEventListener('click', async () => {
        try {
          const blob = await canvasToBlob();
          if (!navigator.clipboard || !window.ClipboardItem) throw new Error('Clipboard de imagen no disponible');
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          showToast(COPY.copiedToast);
        } catch (_) {
          showToast(COPY.copyFailedToast);
        }
      });

      shareImageButton.addEventListener('click', shareImage);

      document.querySelectorAll('[data-social]').forEach(button => {
        button.addEventListener('click', () => shareTextTo(button.dataset.social));
      });

      applyBrandAndCopyConfig();
      loadBrandLogo();
    })();
  </script>
</body>
